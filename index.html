<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Street City v4.1</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;color:#fff;text-shadow:0 2px 3px #000;font-weight:800}
.top{left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));font-size:14px}
.mission{left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));background:#0009;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
.stars{right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));font-size:18px;color:#ffd43b}
.mini{right:max(10px,env(safe-area-inset-right));top:46px;width:104px;height:104px;border-radius:50%;border:3px solid #fff8;background:#14202ccc;overflow:hidden}
.mini canvas{position:static;width:100%;height:100%}
#stick{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:132px;height:132px;border:3px solid #fff7;border-radius:50%;background:#0005;z-index:7;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:52px;height:52px;border-radius:50%;background:#ffffffdd;border:3px solid #222}
.actions{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btn{border:2px solid #ffffff99;border-radius:50%;width:68px;height:68px;background:#161b22cc;color:white;font-weight:900;font-size:11px;touch-action:manipulation}
.btn.small{width:56px;height:56px}
.health{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:150px;height:10px;background:#000b;border:1px solid #fff8;border-radius:8px;z-index:6}
.health i{display:block;height:100%;width:100%;background:#4ce66b;border-radius:8px}
#toast{position:fixed;z-index:10;left:50%;top:25%;transform:translate(-50%,-50%);color:#fff;font-size:25px;font-weight:1000;text-shadow:0 3px 5px #000;opacity:0;transition:.25s;pointer-events:none}
@media(max-width:600px) and (orientation:portrait){.mission{top:38px}.mini{top:75px;width:86px;height:86px}#stick{width:118px;height:118px}#knob{left:33px;top:33px;width:48px;height:48px}.btn{width:62px;height:62px}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud" style="left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;opacity:.65">STREET CITY v4.1 • UK TRAFFIC</div>
<div class="hud top">💵 $<span id="cash">0</span><br>❤️ <span id="hptext">100</span></div>
<div class="hud mission" id="mission">V4.1 • CHAOS RUN — collect 5 drops</div>
<div class="hud stars" id="stars">☆☆☆☆☆</div>
<div class="hud mini"><canvas id="map" width="100" height="100"></canvas></div>
<div id="stick"><div id="knob"></div></div>
<div class="actions"><button class="btn small" id="boost">SPRINT</button><button class="btn" id="action">ENTER</button></div>
<div class="health"><i id="hp"></i></div><div id="toast"></div>
<div class="hud" id="district" style="left:50%;top:70px;transform:translateX(-50%);font-size:10px;letter-spacing:3px;opacity:.7"></div>
<div class="hud" id="carhp" style="left:max(12px,env(safe-area-inset-left));bottom:max(150px,env(safe-area-inset-bottom));font-size:11px;background:#0009;padding:6px 9px;border-radius:8px;display:none">CAR 100%</div>
<div class="hud" id="speedo" style="right:max(18px,env(safe-area-inset-right));bottom:max(168px,env(safe-area-inset-bottom));font-size:16px;background:#0009;padding:7px 10px;border-radius:9px;display:none">0 MPH</div>
<script>
(()=>{
const C=document.getElementById('g'),ctx=C.getContext('2d'),M=document.getElementById('map'),mx=M.getContext('2d');
const stick=document.getElementById('stick'),knob=document.getElementById('knob'),action=document.getElementById('action'),boostB=document.getElementById('boost');
const cashE=document.getElementById('cash'),starsE=document.getElementById('stars'),missionE=document.getElementById('mission'),hpE=document.getElementById('hp'),hpT=document.getElementById('hptext'),toast=document.getElementById('toast'),districtE=document.getElementById('district'),carhpE=document.getElementById('carhp'),speedo=document.getElementById('speedo');
let W,H,D=1,last=performance.now(),jx=0,jy=0,pid=null,boost=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

const WORLD=1800, GAP=300, RW=92, LANE=22, WALK=17;
const buildings=[],cars=[],peds=[],drops=[],cops=[],trees=[],stops=[];
let P={x:900,y:900,a:0,hp:100,cash:0,wanted:0,inCar:null,speed:0,got:0};
let missionStage=1,heistCar=null,garage={x:1500,y:1500,r:58},shake=0;

const rand=(a,b)=>a+Math.random()*(b-a), dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function blocked(x,y){return buildings.some(b=>x>b.x-10&&x<b.x+b.w+10&&y>b.y-10&&y<b.y+b.h+10)}
function msg(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.opacity=0,1100)}
function wanted(n){P.wanted=Math.max(0,Math.min(5,n));starsE.textContent='★'.repeat(P.wanted)+'☆'.repeat(5-P.wanted)}
function district(){if(P.x<600&&P.y<900)return'DOCKSIDE';if(P.x>1200&&P.y<900)return'UPTOWN';if(P.y>1200)return'SOUTH CITY';return'DOWNTOWN'}

/* City blocks */
for(let gx=0;gx<WORLD;gx+=GAP)for(let gy=0;gy<WORLD;gy+=GAP){
 let x=gx+RW/2+30,y=gy+RW/2+30,w=GAP-RW-60,h=GAP-RW-60;
 if(x+w<WORLD&&y+h<WORLD)buildings.push({x,y,w,h,c:`hsl(${rand(15,45)},${rand(8,22)}%,${rand(40,62)}%)`});
}
/* Trees live in green block margins/fields, not the carriageway */
for(let gx=0;gx<WORLD;gx+=GAP)for(let gy=0;gy<WORLD;gy+=GAP){
 for(let i=0;i<5;i++){
  let x=gx+RW/2+18+rand(0,GAP-RW-36),y=gy+RW/2+18+rand(0,GAP-RW-36);
  if(!blocked(x,y))trees.push({x,y,r:rand(8,13)});
 }
}
/* UK left-hand traffic lanes. Horizontal: eastbound uses north/upper lane; westbound lower lane.
   Vertical: southbound uses west/left lane; northbound right lane. */
function makeTraffic(horizontal,road,dir){
 if(horizontal){
  let y=road+(dir>0?-LANE:LANE);
  return{x:rand(0,WORLD),y,a:dir>0?0:Math.PI,dir,h:true,v:rand(42,70),hp:100,c:`hsl(${rand(0,360)},55%,48%)`,traffic:true};
 }else{
  let x=road+(dir>0?-LANE:LANE);
  return{x,y:rand(0,WORLD),a:dir>0?Math.PI/2:-Math.PI/2,dir,h:false,v:rand(42,70),hp:100,c:`hsl(${rand(0,360)},55%,48%)`,traffic:true};
 }
}
for(let i=0;i<28;i++){
 let road=Math.floor(rand(0,7))*GAP, h=Math.random()<.5, dir=Math.random()<.5?1:-1;
 cars.push(makeTraffic(h,road,dir));
}
heistCar=cars[7];heistCar.heist=true;heistCar.c='#f2b632';

/* Pedestrians spawn on pavements only and walk parallel to roads */
function makePed(){
 let road=Math.floor(rand(0,7))*GAP,h=Math.random()<.5,side=Math.random()<.5?-1:1,dir=Math.random()<.5?-1:1;
 if(h)return{x:rand(10,WORLD-10),y:road+side*(RW/2+WALK),h:true,dir,a:dir>0?0:Math.PI,v:rand(15,25),c:`hsl(${rand(0,360)},45%,55%)`};
 return{x:road+side*(RW/2+WALK),y:rand(10,WORLD-10),h:false,dir,a:dir>0?Math.PI/2:-Math.PI/2,v:rand(15,25),c:`hsl(${rand(0,360)},45%,55%)`};
}
for(let i=0;i<38;i++)peds.push(makePed());

/* STOP signs on alternating junction approaches */
for(let x=GAP;x<WORLD;x+=GAP)for(let y=GAP;y<WORLD;y+=GAP){
 stops.push({x:x-RW/2-14,y:y-RW/2-14,a:0});
 stops.push({x:x+RW/2+14,y:y+RW/2+14,a:Math.PI});
}

/* Cash drops on pavements */
for(let i=0;i<12;i++){let p=makePed();drops.push({x:p.x,y:p.y,taken:false})}

function nearestCar(){let best=null,d=70;for(const c of cars){let n=dist(P.x,P.y,c.x,c.y);if(n<d){d=n;best=c}}return best}
action.onclick=()=>{
 if(P.inCar){let c=P.inCar;P.inCar=null;P.x=c.x+Math.cos(c.a+Math.PI/2)*38;P.y=c.y+Math.sin(c.a+Math.PI/2)*38;P.speed=0;action.textContent='ENTER';boostB.textContent='SPRINT';msg('On foot');return}
 let c=nearestCar();
 if(c){P.inCar=c;c.traffic=false;P.x=c.x;P.y=c.y;P.a=c.a;wanted(Math.max(1,P.wanted));action.textContent='EXIT';boostB.textContent='BOOST';
  if(c.heist&&missionStage===2){wanted(3);missionStage=3;missionE.textContent='V4.1 • HEIST — DELIVER TO GARAGE';msg('TARGET CAR STOLEN! 3★ HEAT')}
  else msg('Vehicle taken!');
 }else msg('Move closer to a car')
};
boostB.addEventListener('pointerdown',e=>{e.preventDefault();boost=true});
['pointerup','pointercancel','pointerleave'].forEach(k=>boostB.addEventListener(k,()=>boost=false));
function stickSet(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),max=r.width*.32;if(mag>max){dx=dx/mag*max;dy=dy/mag*max}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/max;jy=dy/max}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;stick.setPointerCapture(pid);stickSet(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();stickSet(e)}});
function rel(e){if(pid===null||e.pointerId===pid){pid=null;jx=jy=0;knob.style.transform='translate(0,0)'}}
stick.addEventListener('pointerup',rel);stick.addEventListener('pointercancel',rel);

function spawnCop(){let a=rand(0,Math.PI*2),d=400;cops.push({x:Math.max(20,Math.min(WORLD-20,P.x+Math.cos(a)*d)),y:Math.max(20,Math.min(WORLD-20,P.y+Math.sin(a)*d)),a:0,v:0,c:'#f4f4f4',police:true})}
let wantedTimer=0,damageTimer=0;
function update(dt){
 districtE.textContent=district();
 if(P.inCar){
  let c=P.inCar,th=-jy,st=jx;c.v=(c.v||0)+th*150*dt;c.v*=Math.pow(.985,dt*60);c.v=Math.max(-60,Math.min(boost?190:135,c.v));
  if(Math.abs(c.v)>4)c.a+=st*1.9*dt*(c.v>=0?1:-1);
  let nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
  if(!blocked(nx,ny)){c.x=nx;c.y=ny}else c.v*=-.2;
  P.x=c.x;P.y=c.y;P.a=c.a;P.speed=c.v;speedo.style.display=carhpE.style.display='block';speedo.textContent=Math.round(Math.abs(c.v)*.48)+' MPH';carhpE.textContent='CAR '+Math.max(0,Math.round(c.hp))+'%';
 }else{
  let m=Math.min(1,Math.hypot(jx,jy));if(m>.05){let a=Math.atan2(jy,jx),s=(boost?145:92)*m,nx=P.x+Math.cos(a)*s*dt,ny=P.y+Math.sin(a)*s*dt;if(!blocked(nx,ny)){P.x=nx;P.y=ny}P.a=a}
  P.speed=0;speedo.style.display=carhpE.style.display='none';
 }
 P.x=Math.max(8,Math.min(WORLD-8,P.x));P.y=Math.max(8,Math.min(WORLD-8,P.y));

 /* Lane-locked traffic */
 for(const c of cars){if(!c.traffic||c===P.inCar)continue;
  if(c.h){c.x+=c.dir*c.v*dt;c.a=c.dir>0?0:Math.PI;if(c.x<-45)c.x=WORLD+45;if(c.x>WORLD+45)c.x=-45}
  else{c.y+=c.dir*c.v*dt;c.a=c.dir>0?Math.PI/2:-Math.PI/2;if(c.y<-45)c.y=WORLD+45;if(c.y>WORLD+45)c.y=-45}
 }
 /* Pavement-locked pedestrians; panic makes them run along pavement, not into traffic */
 for(const p of peds){let panic=P.wanted&&dist(P.x,P.y,p.x,p.y)<150,s=panic?52:p.v,dir=p.dir;
  if(p.h){p.x+=dir*s*dt;p.a=dir>0?0:Math.PI;if(p.x<5){p.x=5;p.dir=1}if(p.x>WORLD-5){p.x=WORLD-5;p.dir=-1}}
  else{p.y+=dir*s*dt;p.a=dir>0?Math.PI/2:-Math.PI/2;if(p.y<5){p.y=5;p.dir=1}if(p.y>WORLD-5){p.y=WORLD-5;p.dir=-1}}
 }
 for(const d of drops)if(!d.taken&&dist(P.x,P.y,d.x,d.y)<28){d.taken=true;P.cash+=100;P.got++;cashE.textContent=P.cash;msg('+$100');
  missionE.textContent=P.got<5?`V4.1 • CHAOS RUN ${P.got}/5`:'V4.1 • STEAL THE GOLD CAR';
  if(P.got===5){P.cash+=500;cashE.textContent=P.cash;missionStage=2;wanted(0);msg('NEW MISSION: STEAL GOLD CAR')}
 }
 if(P.wanted){while(cops.length<P.wanted+1)spawnCop();wantedTimer+=dt;if(wantedTimer>20){wanted(P.wanted-1);wantedTimer=0}}else cops.length=0;
 damageTimer-=dt;
 for(const c of cops){let a=Math.atan2(P.y-c.y,P.x-c.x);c.a=a;c.v=90+P.wanted*15;c.x+=Math.cos(a)*c.v*dt;c.y+=Math.sin(a)*c.v*dt;
  if(dist(P.x,P.y,c.x,c.y)<35&&damageTimer<=0){if(P.inCar){P.inCar.hp-=8;shake=6}else P.hp-=10;damageTimer=.7;hpE.style.width=P.hp+'%';hpT.textContent=P.hp;msg('POLICE HIT!')}
 }
 if(missionStage===3&&P.inCar===heistCar&&dist(P.x,P.y,garage.x,garage.y)<garage.r){missionStage=4;P.cash+=1500;cashE.textContent=P.cash;wanted(0);missionE.textContent='V4.1 • HEIST COMPLETE — FREE ROAM';msg('HEIST COMPLETE +$1500')}
}

function carDraw(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#222';ctx.fillRect(-21,-10.5,42,21);ctx.fillStyle=c.c;ctx.fillRect(-19,-10,38,20);
 ctx.fillStyle='#b9d8e8';ctx.fillRect(-5,-8,13,16);ctx.fillStyle='#fff4b0';ctx.fillRect(16,-7,3,5);ctx.fillRect(16,2,3,5);
 ctx.fillStyle='#d94141';ctx.fillRect(-19,-7,3,5);ctx.fillRect(-19,2,3,5);
 if(c.police){ctx.globalAlpha=.65+.35*Math.sin(performance.now()*.02);ctx.fillStyle='#e33';ctx.fillRect(-2,-9,4,4);ctx.fillStyle='#38f';ctx.fillRect(2,-9,4,4);ctx.globalAlpha=1}
 ctx.restore();
}
function drawStop(s){
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle='#666';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-18);ctx.stroke();
 ctx.fillStyle='#c62828';ctx.beginPath();for(let i=0;i<8;i++){let a=Math.PI/8+i*Math.PI/4,x=Math.cos(a)*9,y=-27+Math.sin(a)*9;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 5px sans-serif';ctx.textAlign='center';ctx.fillText('STOP',0,-25);ctx.restore();
}
function draw(){
 let shx=shake?rand(-shake,shake):0,shy=shake?rand(-shake,shake):0;shake*=.82;
 let zoom=P.inCar&&Math.abs(P.speed)>100?.78:1,ox=W/2-P.x*zoom+shx,oy=H/2-P.y*zoom+shy;
 ctx.fillStyle='#557d50';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(zoom,zoom);
 /* pavements and roads */
 ctx.fillStyle='#b7b2a7';for(let v=0;v<=WORLD;v+=GAP){ctx.fillRect(0,v-RW/2-14,WORLD,RW+28);ctx.fillRect(v-RW/2-14,0,RW+28,WORLD)}
 ctx.fillStyle='#3d4146';for(let v=0;v<=WORLD;v+=GAP){ctx.fillRect(0,v-RW/2,WORLD,RW);ctx.fillRect(v-RW/2,0,RW,WORLD)}
 ctx.strokeStyle='#d9c85f';ctx.lineWidth=2;ctx.setLineDash([18,20]);for(let v=0;v<=WORLD;v+=GAP){ctx.beginPath();ctx.moveTo(0,v);ctx.lineTo(WORLD,v);ctx.stroke();ctx.beginPath();ctx.moveTo(v,0);ctx.lineTo(v,WORLD);ctx.stroke()}ctx.setLineDash([]);
 /* lane edge markings */
 ctx.strokeStyle='#eee';ctx.lineWidth=2;for(let v=0;v<=WORLD;v+=GAP){ctx.beginPath();ctx.moveTo(0,v-RW/2+5);ctx.lineTo(WORLD,v-RW/2+5);ctx.stroke();ctx.beginPath();ctx.moveTo(0,v+RW/2-5);ctx.lineTo(WORLD,v+RW/2-5);ctx.stroke();ctx.beginPath();ctx.moveTo(v-RW/2+5,0);ctx.lineTo(v-RW/2+5,WORLD);ctx.stroke();ctx.beginPath();ctx.moveTo(v+RW/2-5,0);ctx.lineTo(v+RW/2-5,WORLD);ctx.stroke()}
 /* buildings */
 for(const b of buildings){ctx.fillStyle='#2c2c2c';ctx.fillRect(b.x+8,b.y+10,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#b8d5d7';for(let x=b.x+15;x<b.x+b.w-8;x+=28)for(let y=b.y+15;y<b.y+b.h-8;y+=30)ctx.fillRect(x,y,10,14)}
 /* field trees */
 for(const t of trees){ctx.fillStyle='#4b3829';ctx.fillRect(t.x-2,t.y,4,10);ctx.fillStyle='#347342';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}
 for(const s of stops)drawStop(s);
 if(missionStage===2){ctx.strokeStyle='#ffd43b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(heistCar.x,heistCar.y,31+Math.sin(performance.now()*.006)*4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd43b';ctx.font='bold 12px sans-serif';ctx.fillText('STEAL',heistCar.x-18,heistCar.y-34)}
 if(missionStage===3){ctx.fillStyle='#39e66d55';ctx.beginPath();ctx.arc(garage.x,garage.y,garage.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7cff9b';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('GARAGE',garage.x-31,garage.y+5)}
 for(const d of drops)if(!d.taken){ctx.fillStyle='#55ed75';ctx.beginPath();ctx.arc(d.x,d.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('$',d.x-3,d.y+4)}
 for(const p of peds){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-5,-5,12,11);ctx.fillStyle='#222';ctx.fillRect(-5,5,4,7);ctx.fillRect(3,5,4,7);ctx.fillStyle='#e0b08b';ctx.beginPath();ctx.arc(1,-9,5,0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const c of cars)carDraw(c);for(const c of cops)carDraw(c);
 if(!P.inCar){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a);ctx.fillStyle='#2578ff';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(3,-5);ctx.lineTo(3,5);ctx.fill();ctx.restore()}
 ctx.restore();
 /* minimap */
 mx.clearRect(0,0,100,100);mx.fillStyle='#31533a';mx.fillRect(0,0,100,100);mx.strokeStyle='#555';mx.lineWidth=5;
 for(let v=0;v<=WORLD;v+=GAP){let q=v/WORLD*100;mx.beginPath();mx.moveTo(0,q);mx.lineTo(100,q);mx.stroke();mx.beginPath();mx.moveTo(q,0);mx.lineTo(q,100);mx.stroke()}
 mx.fillStyle='#39f';mx.beginPath();mx.arc(P.x/WORLD*100,P.y/WORLD*100,3,0,Math.PI*2);mx.fill();
 if(missionStage===2){mx.fillStyle='#ffd43b';mx.fillRect(heistCar.x/WORLD*100-2,heistCar.y/WORLD*100-2,5,5)}
 if(missionStage===3){mx.fillStyle='#5f7';mx.fillRect(garage.x/WORLD*100-3,garage.y/WORLD*100-3,6,6)}
 mx.fillStyle='#f44';for(const c of cops){mx.beginPath();mx.arc(c.x/WORLD*100,c.y/WORLD*100,2,0,Math.PI*2);mx.fill()}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body></html>
