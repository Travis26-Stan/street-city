<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Street City v3</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;z-index:5;color:#fff;text-shadow:0 2px 3px #000;font-weight:800}.top{left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));font-size:14px}.mission{left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));background:#0009;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}.stars{right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));font-size:18px;color:#ffd43b}.mini{right:max(10px,env(safe-area-inset-right));top:46px;width:104px;height:104px;border-radius:50%;border:3px solid #fff8;background:#14202ccc;overflow:hidden}.mini canvas{position:static;width:100%;height:100%}
#stick{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:132px;height:132px;border:3px solid #fff7;border-radius:50%;background:#0005;z-index:7;touch-action:none}#knob{position:absolute;left:38px;top:38px;width:52px;height:52px;border-radius:50%;background:#ffffffdd;border:3px solid #222}
.actions{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;gap:10px;align-items:flex-end}.btn{border:2px solid #ffffff99;border-radius:50%;width:68px;height:68px;background:#161b22cc;color:white;font-weight:900;font-size:11px;touch-action:manipulation}.btn.small{width:56px;height:56px}.health{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:150px;height:10px;background:#000b;border:1px solid #fff8;border-radius:8px;z-index:6}.health i{display:block;height:100%;width:100%;background:#4ce66b;border-radius:8px}
#toast{position:fixed;z-index:10;left:50%;top:25%;transform:translate(-50%,-50%);color:#fff;font-size:25px;font-weight:1000;text-shadow:0 3px 5px #000;opacity:0;transition:.25s;pointer-events:none}
@media(max-width:600px) and (orientation:portrait){.mission{top:38px}.mini{top:75px;width:86px;height:86px}#stick{width:118px;height:118px}#knob{left:33px;top:33px;width:48px;height:48px}.btn{width:62px;height:62px}}
</style></head><body><canvas id="g"></canvas><div class="hud" style="left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;opacity:.65">STREET CITY v3</div><div class="hud top">💵 $<span id="cash">0</span><br>❤️ <span id="hptext">100</span></div><div class="hud mission" id="mission">V3 • CASH RUN — collect 5 drops</div><div class="hud stars" id="stars">☆☆☆☆☆</div><div class="hud mini"><canvas id="map" width="100" height="100"></canvas></div><div id="stick"><div id="knob"></div></div><div class="actions"><button class="btn small" id="boost">SPRINT</button><button class="btn" id="action">ENTER</button></div><div class="health"><i id="hp"></i></div><div id="toast"></div><div class="hud" id="district" style="left:50%;top:70px;transform:translateX(-50%);font-size:10px;letter-spacing:3px;opacity:.7"></div><div class="hud" id="speedo" style="right:max(18px,env(safe-area-inset-right));bottom:max(168px,env(safe-area-inset-bottom));font-size:16px;background:#0009;padding:7px 10px;border-radius:9px;display:none">0 MPH</div>
<script>
(()=>{const C=document.getElementById('g'),ctx=C.getContext('2d'),M=document.getElementById('map'),mx=M.getContext('2d'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),action=document.getElementById('action'),boostB=document.getElementById('boost'),cashE=document.getElementById('cash'),starsE=document.getElementById('stars'),missionE=document.getElementById('mission'),hpE=document.getElementById('hp'),hpT=document.getElementById('hptext'),toast=document.getElementById('toast'),districtE=document.getElementById('district'),speedo=document.getElementById('speedo');let W,H,D=1,last=performance.now(),jx=0,jy=0,pid=null,boost=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const WORLD=1800,roadGap=300,roadW=92;let P={x:900,y:900,a:0,hp:100,cash:0,wanted:0,inCar:null,speed:0,got:0};const buildings=[],cars=[],peds=[],drops=[],cops=[];
function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}function road(v){let m=v%roadGap;return m<roadW||m>roadGap-roadW}
for(let gx=0;gx<WORLD;gx+=roadGap)for(let gy=0;gy<WORLD;gy+=roadGap){let x=gx+roadW/2+25,y=gy+roadW/2+25,w=roadGap-roadW-50,h=roadGap-roadW-50;if(x+w<WORLD&&y+h<WORLD)buildings.push({x,y,w,h,c:`hsl(${rand(15,45)},${rand(8,22)}%,${rand(40,62)}%)`,floors:2+Math.floor(rand(0,6))})}
function onRoadPos(){if(Math.random()<.5){let line=Math.floor(rand(0,6))*roadGap;return{x:rand(30,WORLD-30),y:line+rand(-30,30)}}let line=Math.floor(rand(0,6))*roadGap;return{x:line+rand(-30,30),y:rand(30,WORLD-30)}}
for(let i=0;i<26;i++){let q=onRoadPos(),horizontal=road(q.y);cars.push({x:q.x,y:q.y,a:horizontal?(Math.random()<.5?0:Math.PI):(Math.random()<.5?Math.PI/2:-Math.PI/2),v:rand(45,75),c:`hsl(${rand(0,360)},55%,48%)`,traffic:true})}
for(let i=0;i<34;i++){let q=onRoadPos();peds.push({x:q.x,y:q.y,a:rand(0,Math.PI*2),v:rand(12,28),c:`hsl(${rand(0,360)},45%,55%)`,t:rand(1,5)})}
for(let i=0;i<12;i++){let q=onRoadPos();drops.push({x:q.x,y:q.y,taken:false})}
function blocked(x,y){return buildings.some(b=>x>b.x-10&&x<b.x+b.w+10&&y>b.y-10&&y<b.y+b.h+10)}
function clampP(){P.x=Math.max(8,Math.min(WORLD-8,P.x));P.y=Math.max(8,Math.min(WORLD-8,P.y))}
function msg(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.opacity=0,1100)}
function wanted(n){P.wanted=Math.max(0,Math.min(5,n));starsE.textContent='★'.repeat(P.wanted)+'☆'.repeat(5-P.wanted)}
function nearestCar(){let best=null,d=70;for(const c of cars){let n=dist(P.x,P.y,c.x,c.y);if(n<d){d=n;best=c}}return best}
action.onclick=()=>{if(P.inCar){let c=P.inCar;P.inCar=null;P.x=c.x+Math.cos(c.a+Math.PI/2)*38;P.y=c.y+Math.sin(c.a+Math.PI/2)*38;P.speed=0;action.textContent='ENTER';boostB.textContent='SPRINT';msg('On foot');return}let c=nearestCar();if(c){P.inCar=c;c.traffic=false;P.x=c.x;P.y=c.y;P.a=c.a;wanted(Math.max(1,P.wanted));action.textContent='EXIT';boostB.textContent='BOOST';msg('Vehicle taken!') }else msg('Move closer to a car')};
boostB.addEventListener('pointerdown',e=>{e.preventDefault();boost=true});['pointerup','pointercancel','pointerleave'].forEach(k=>boostB.addEventListener(k,()=>boost=false));
function stickSet(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),max=r.width*.32;if(mag>max){dx=dx/mag*max;dy=dy/mag*max}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/max;jy=dy/max}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;stick.setPointerCapture(pid);stickSet(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();stickSet(e)}});function rel(e){if(pid===null||e.pointerId===pid){pid=null;jx=jy=0;knob.style.transform='translate(0,0)'}}stick.addEventListener('pointerup',rel);stick.addEventListener('pointercancel',rel);
function spawnCop(){let ang=rand(0,Math.PI*2),d=420,c={x:P.x+Math.cos(ang)*d,y:P.y+Math.sin(ang)*d,a:0,v:0,c:'#f4f4f4',police:true};c.x=Math.max(20,Math.min(WORLD-20,c.x));c.y=Math.max(20,Math.min(WORLD-20,c.y));cops.push(c)}
let wantedTimer=0,damageTimer=0;
function update(dt){districtE.textContent=district();if(P.inCar){let c=P.inCar,throttle=-jy,steer=jx;c.v=(c.v||0)+throttle*150*dt;c.v*=Math.pow(.985,dt*60);let max=boost?190:135;c.v=Math.max(-60,Math.min(max,c.v));if(Math.abs(c.v)>4)c.a+=steer*1.9*dt*(c.v>=0?1:-1);let nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;if(!blocked(nx,ny)){c.x=nx;c.y=ny}else c.v*=-.2;P.x=c.x;P.y=c.y;P.a=c.a;P.speed=c.v;speedo.style.display='block';speedo.textContent=Math.round(Math.abs(c.v)*.48)+' MPH'}else{let mag=Math.min(1,Math.hypot(jx,jy));if(mag>.05){let a=Math.atan2(jy,jx),s=(boost?145:92)*mag,nx=P.x+Math.cos(a)*s*dt,ny=P.y+Math.sin(a)*s*dt;if(!blocked(nx,ny)){P.x=nx;P.y=ny}P.a=a}P.speed=0;speedo.style.display='none'}clampP();
for(const c of cars){if(!c.traffic||c===P.inCar)continue;c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;if(c.x<-40)c.x=WORLD+40;if(c.x>WORLD+40)c.x=-40;if(c.y<-40)c.y=WORLD+40;if(c.y>WORLD+40)c.y=-40}
for(const p of peds){p.t-=dt;if(p.t<0){p.a+=rand(-1.5,1.5);p.t=rand(1,4)}let nx=p.x+Math.cos(p.a)*p.v*dt,ny=p.y+Math.sin(p.a)*p.v*dt;if(nx<10||nx>WORLD-10||ny<10||ny>WORLD-10||blocked(nx,ny)){p.a+=Math.PI+rand(-.7,.7)}else{p.x=nx;p.y=ny}}
for(const tc of cars){if(tc!==P.inCar&&P.inCar&&dist(P.x,P.y,tc.x,tc.y)<27){P.inCar.v*=-.25;tc.v*=.55;if(P.wanted<2)wanted(2)}}
for(const ped of peds){if(P.inCar&&Math.abs(P.inCar.v)>35&&dist(P.x,P.y,ped.x,ped.y)<22){ped.x+=Math.cos(P.inCar.a)*55;ped.y+=Math.sin(P.inCar.a)*55;wanted(Math.max(2,P.wanted));msg('POLICE ALERT')}}
for(const d of drops)if(!d.taken&&dist(P.x,P.y,d.x,d.y)<28){d.taken=true;P.cash+=100;P.got++;cashE.textContent=P.cash;msg('+$100');missionE.textContent=P.got<5?`V3 • CASH RUN ${P.got}/5`:'MISSION PASSED • Lose the cops';if(P.got===5){P.cash+=500;cashE.textContent=P.cash;wanted(Math.max(2,P.wanted));msg('MISSION PASSED +$500')}}
if(P.wanted){while(cops.length<P.wanted+1)spawnCop();wantedTimer+=dt;if(wantedTimer>18){wanted(P.wanted-1);wantedTimer=0}}else if(cops.length)cops.length=0;
damageTimer-=dt;for(const c of cops){let a=Math.atan2(P.y-c.y,P.x-c.x);c.a=a;c.v=92+P.wanted*16;c.x+=Math.cos(a)*c.v*dt;c.y+=Math.sin(a)*c.v*dt;if(dist(P.x,P.y,c.x,c.y)<35&&damageTimer<=0){P.hp-=10;damageTimer=.7;hpE.style.width=P.hp+'%';hpT.textContent=P.hp;msg('POLICE HIT!');if(P.hp<=0){P.hp=100;P.x=P.y=900;P.inCar=null;P.cash=Math.max(0,P.cash-200);cashE.textContent=P.cash;wanted(0);hpE.style.width='100%';hpT.textContent='100';action.textContent='ENTER';msg('BUSTED -$200')}}}}
function carDraw(c,sx,sy,scale){ctx.save();ctx.translate(sx,sy);ctx.rotate(c.a);ctx.fillStyle='#222';ctx.fillRect(-21*scale,-10.5*scale,42*scale,21*scale);ctx.fillStyle=c.c;ctx.fillRect(-19*scale,-10*scale,38*scale,20*scale);ctx.fillStyle='#b9d8e8';ctx.fillRect(-5*scale,-8*scale,13*scale,16*scale);ctx.fillStyle='#fff4b0';ctx.fillRect(16*scale,-7*scale,3*scale,5*scale);ctx.fillRect(16*scale,2*scale,3*scale,5*scale);ctx.fillStyle='#d94141';ctx.fillRect(-19*scale,-7*scale,3*scale,5*scale);ctx.fillRect(-19*scale,2*scale,3*scale,5*scale);ctx.fillStyle='#171717';ctx.fillRect(-14*scale,-12*scale,8*scale,3*scale);ctx.fillRect(8*scale,-12*scale,8*scale,3*scale);ctx.fillRect(-14*scale,9*scale,8*scale,3*scale);ctx.fillRect(8*scale,9*scale,8*scale,3*scale);if(c.police){ctx.globalAlpha=.65+.35*Math.sin(performance.now()*.02);ctx.fillStyle='#e33';ctx.fillRect(-2*scale,-9*scale,4*scale,4*scale);ctx.fillStyle='#38f';ctx.fillRect(2*scale,-9*scale,4*scale,4*scale);ctx.globalAlpha=1}ctx.restore()}
function district(){if(P.x<600&&P.y<900)return'DOCKSIDE';if(P.x>1200&&P.y<900)return'UPTOWN';if(P.y>1200)return'SOUTH CITY';return'DOWNTOWN'}
function draw(){let zoom=P.inCar?.speed&&Math.abs(P.inCar.speed)>100?.78:1,ox=W/2-P.x*zoom,oy=H/2-P.y*zoom;ctx.fillStyle='#557d50';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(zoom,zoom);
ctx.fillStyle='#b7b2a7';for(let v=0;v<=WORLD;v+=roadGap){ctx.fillRect(0,v-roadW/2-12,WORLD,roadW+24);ctx.fillRect(v-roadW/2-12,0,roadW+24,WORLD)}
ctx.fillStyle='#3d4146';for(let v=0;v<=WORLD;v+=roadGap){ctx.fillRect(0,v-roadW/2,WORLD,roadW);ctx.fillRect(v-roadW/2,0,roadW,WORLD)}
ctx.strokeStyle='#d0d0c8';ctx.lineWidth=2;for(let v=0;v<=WORLD;v+=roadGap){ctx.beginPath();ctx.moveTo(0,v-roadW/2);ctx.lineTo(WORLD,v-roadW/2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,v+roadW/2);ctx.lineTo(WORLD,v+roadW/2);ctx.stroke();ctx.beginPath();ctx.moveTo(v-roadW/2,0);ctx.lineTo(v-roadW/2,WORLD);ctx.stroke();ctx.beginPath();ctx.moveTo(v+roadW/2,0);ctx.lineTo(v+roadW/2,WORLD);ctx.stroke()}ctx.strokeStyle='#d9c85f';ctx.lineWidth=3;ctx.setLineDash([20,22]);for(let v=0;v<=WORLD;v+=roadGap){ctx.beginPath();ctx.moveTo(0,v);ctx.lineTo(WORLD,v);ctx.stroke();ctx.beginPath();ctx.moveTo(v,0);ctx.lineTo(v,WORLD);ctx.stroke()}ctx.setLineDash([]);
/* junction markings + crossings */
ctx.fillStyle='#ddd';for(let vx=0;vx<=WORLD;vx+=roadGap)for(let vy=0;vy<=WORLD;vy+=roadGap){for(let z=-28;z<=28;z+=14){ctx.fillRect(vx-46,vy+z,20,5);ctx.fillRect(vx+26,vy+z,20,5);ctx.fillRect(vx+z,vy-46,5,20);ctx.fillRect(vx+z,vy+26,5,20)}}

for(const b of buildings){ctx.fillStyle='#2c2c2c';ctx.fillRect(b.x+8,b.y+10,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#b8d5d7';for(let xx=b.x+15;xx<b.x+b.w-8;xx+=28)for(let yy=b.y+15;yy<b.y+b.h-8;yy+=30)ctx.fillRect(xx,yy,10,14);
ctx.fillStyle='#666';ctx.fillRect(b.x+b.w*.38,b.y+b.h*.38,22,15);ctx.fillStyle='#888';ctx.fillRect(b.x+b.w*.38+4,b.y+b.h*.38+3,14,9)}
for(let v=0;v<=WORLD;v+=roadGap){for(let q=140;q<WORLD;q+=220){ctx.fillStyle='#4b3829';ctx.fillRect(q-3,v+roadW/2+15,6,16);ctx.fillStyle='#397544';ctx.beginPath();ctx.arc(q,v+roadW/2+10,11,0,7);ctx.fill();ctx.fillStyle='#555';ctx.fillRect(v+roadW/2+18,q-14,3,28);ctx.fillStyle='#ffe89a';ctx.beginPath();ctx.arc(v+roadW/2+19.5,q-15,4,0,7);ctx.fill()}}
for(const d of drops)if(!d.taken){ctx.fillStyle='#55ed75';ctx.beginPath();ctx.arc(d.x,d.y,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('$',d.x-3,d.y+4)}
for(const p of peds){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-5,-5,12,11);ctx.fillStyle='#222';ctx.fillRect(-5,5,4,7);ctx.fillRect(3,5,4,7);ctx.fillStyle='#e0b08b';ctx.beginPath();ctx.arc(1,-9,5,0,7);ctx.fill();ctx.restore()}
for(const c of cars)carDraw(c,c.x,c.y,1);for(const c of cops)carDraw(c,c.x,c.y,1);
if(!P.inCar){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a);ctx.fillStyle='#2578ff';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(3,-5);ctx.lineTo(3,5);ctx.fill();ctx.restore()}ctx.restore();
mx.clearRect(0,0,100,100);mx.fillStyle='#31533a';mx.fillRect(0,0,100,100);mx.strokeStyle='#555';mx.lineWidth=5;for(let v=0;v<=WORLD;v+=roadGap){let q=v/WORLD*100;mx.beginPath();mx.moveTo(0,q);mx.lineTo(100,q);mx.stroke();mx.beginPath();mx.moveTo(q,0);mx.lineTo(q,100);mx.stroke()}mx.fillStyle='#39f';mx.beginPath();mx.arc(P.x/WORLD*100,P.y/WORLD*100,3,0,7);mx.fill();mx.fillStyle='#f44';for(const c of cops){mx.beginPath();mx.arc(c.x/WORLD*100,c.y/WORLD*100,2,0,7);mx.fill()}}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();</script></body></html>
